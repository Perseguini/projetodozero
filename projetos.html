<!DOCTYPE html>

  <!-- Arquivo de estilos (o mesmo do index.html) -->

  <!-- Fonte usada no site (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <header class="header">

      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li><a href="index.html" class="nav-hover">Inicio</a></li>
          <li><a href="sobre.html" class="nav-hover">Sobre</a></li>
          <!-- "active" marca em qual página o visitante está -->
          <li><a href="projetos.html" class="nav-hover active">Projetos</a></li>
        </ul>

        <!-- Botão "Fale Comigo" do menu: fica sem efeito de escala -->
        <a href="contato.html" class="btn btn--primary btn--nav">Fale Comigo</a>
      </nav>
