<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Deixa o site responsivo em qualquer tamanho de tela -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guilherme Perseguini | Programador &amp; Designer</title>

  <!-- Arquivo de estilos -->
  <link rel="stylesheet" href="style.css">

  <!-- Fonte usada no site (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ============================= -->
  <!-- CABEÇALHO / MENU DE NAVEGAÇÃO -->
  <!-- ============================= -->
  <header class="header">
    <div class="container header__container">

      <!-- LOGO: troque o icons/logo.svg pela sua marca quando quiser -->
      <a href="index.html" class="logo">
        <img src="icons/logo.svg" alt="Logo Dimitri Teixeira">
      </a>

      <!-- Botão hambúrguer (só aparece no celular) -->
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <img src="icons/menu.svg" alt="Abrir menu">
      </button>

      <!-- Menu de navegação. A classe "nav-hover" é usada pelo JS
           para aplicar o efeito de escala no hover (menos o botão Fale Comigo).
           Os links abaixo abrem em páginas próprias, na MESMA aba
           (sem target="_blank"). -->
      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li><a href="index.html" class="nav-hover active">Inicio</a></li>
          <li><a href="sobre.html" class="nav-hover">Sobre</a></li>
          <li><a href="projetos.html" class="nav-hover">Projetos</a></li>
        </ul>

        <!-- Botão "Fale Comigo" do menu: fica sem efeito de escala -->
        <a href="contato.html" class="btn btn--primary btn--nav">Fale Comigo</a>
      </nav>

    </div>
  </header>

  <!-- ============================= -->
  <!-- SEÇÃO HERO (topo / apresentação) -->
  <!-- ============================= -->
  <section class="hero" id="home">
    <div class="container hero__container">

      <!-- Texto de apresentação -->
      <div class="hero__text">
        <p class="hero__greeting">Olá, eu sou</p>
        <h1 class="hero__name">Guilherme Perseguini</h1>
        <p class="hero__role">Programador Junior</p>

        <!-- Botões de ação: recebem o efeito hover + scale via JS.
             "Fale Comigo!" abre a página de contato na mesma aba.
             "Download CV" abre/baixa o arquivo do currículo (troque o href pelo seu PDF). -->
        <div class="hero__buttons">
          <a href="contato.html" class="btn btn--primary nav-hover">Fale Comigo!</a>
          <a href="curriculo.pdf" class="btn btn--dark nav-hover" download>Download CV</a>
        </div>

        <!-- Ícones de redes sociais: troque os links "href" pelos seus -->
        <div class="hero__social">
          <a href="#" class="social-icon nav-hover" aria-label="Facebook">
            <img src="icons/facebook.svg" alt="Facebook">
          </a>
          <a href="#" class="social-icon nav-hover" aria-label="Google Plus">
            <img src="icons/google.svg" alt="Google Plus">
          </a>
          <a href="#" class="social-icon nav-hover" aria-label="GitHub">
            <img src="icons/github.svg" alt="GitHub">
          </a>
          <a href="#" class="social-icon nav-hover" aria-label="Twitter">
            <img src="icons/twitter.svg" alt="Twitter">
          </a>
        </div>
      </div>

      <!-- Foto: troque images/foto.jpg pela sua foto depois -->
      <div class="hero__photo">
        <img src="images/foto.jpg" alt="Foto de Dimitri Teixeira">
      </div>

    </div>
  </section>

  <!-- Arquivo de scripts (menu mobile + efeito hover dos botões) -->
  <script src="script.js"></script>
</body>
</html>
